[project]
name = "jobscout"
version = "0.1.0"
description = "Multi-Agent Job Research & Fit Analyzer powered by Google ADK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "google-adk>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
dev = ["pytest>=7.0.0", "ruff>=0.4.0"]

[project.scripts]
jobscout = "jobscout.main:main"

[tool.setuptools.packages.find]
include = ["jobscout*"]