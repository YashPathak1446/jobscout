[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscout"
# 0.1.0, not 3.0.0. The "V3" throughout this repo is the architecture
# generation, not a semantic version — a different axis. Publishing 3.0.0
# would claim a stable API and two majors of breaking changes behind it, on a
# package with one release-quality run and four documented limitations.
version = "0.2.0"
description = "Discovers relevant jobs, scores them against your resume, and writes a tailored resume for each one."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yash Pathak" }]
keywords = ["resume", "jobs", "ats", "latex", "gemini"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business",
]

# Deliberately the same set as requirements.txt, which stays as the file people
# already know. The pin style is loose because every one of these is a stable,
# widely-used package and this is an application rather than a library — a
# caller cannot be caught in a version conflict with us.
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
# Scoring without an API key (R36). Optional because the pipeline still runs
# with a Gemini key instead — but it is what makes JobScout work for someone
# who has no key at all, so it is the extra worth installing.
local = ["model2vec>=0.9.0"]
dev = ["ruff>=0.4.0"]

[project.urls]
Homepage = "https://github.com/YashPathak1446/jobscout"
Issues = "https://github.com/YashPathak1446/jobscout/issues"

[project.scripts]
# `jobscout-doctor` first because it is the one to run when something is
# wrong, and roadmap item 8 argued a doctor outlives an installer: an
# installer has to know how to put LaTeX on six platforms, a doctor only has
# to notice it is missing and name it.
jobscout = "agents.orchestrator:main"
jobscout-doctor = "scripts.doctor:main"
jobscout-ui = "scripts.launch_ui:main"

[tool.setuptools]
# Explicit rather than auto-discovered: `data/`, `outputs/` and `user_profiles/`
# sit at the top level and are not importable packages.
packages = ["agents", "scripts", "tools", "tools.assets",
            "tools.cache", "tools.generation", "tools.jobs",
            "tools.profile", "tools.resume", "tools.scraping", "tools.search"]
py-modules = ["config", "app"]

[tool.setuptools.package-data]
# `"*" = ["*.json"]` shipped nothing that mattered: it only covers files
# *inside* listed packages, and every asset lived in top-level `data/` and
# `user_profiles/`, which are not packages. The wheel built from that config
# contained nothing but `.py` files, so an installed copy had no LaTeX
# preamble and could not render a resume at all.
#
# The assets now live in `tools/assets/`, which is a package, and are named by
# extension rather than by filename — the same rule the .gitignore learned:
# ignore by pattern, never by name, because the next file added is the one
# nobody remembers to list.
"tools.assets" = ["*.tex", "*.json"]
"*" = ["*.json"]

[tool.ruff]
line-length = 90
target-version = "py310"
